# fly.toml app configuration file generated for harry-bot-discord on 2026-03-15T08:04:50-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'harry-bot-discord'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  MPLBACKEND = 'Agg'
  # Persist bigleague's cache (Statcast parquet, bloom filter, player register)
  # on the mounted volume.
  BIGLEAGUE_CACHE_DIR = '/data/bigleague'
  # Serve Prometheus metrics for the [metrics] section below.
  HARRY_METRICS_PORT = '9091'

# Fly collects these every 15 s; query them in Grafana at fly-metrics.net.
[metrics]
  port = 9091
  path = '/metrics'

[processes]
  app = 'python main.py'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512

[mounts]
  source = "harry_data_cache"
  destination = "/data"
